<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h1 id="skhead">Rock - Paper - Scissor GO!</h1>

    <div class="choice">
        <button onclick="playgame('Rock')">✊</button>
        <button onclick="playgame('Paper')">🤚</button>
        <button onclick="playgame('Scissor')">✌️</button>
    </div>
    <div id="playerdisplay"></div>
    <div id="computerdisplay"></div>
    <div id="resultdisplay">ALL THE BEST !</div>

    <div class="score">PLAYER SCORE :
        <span id="playerscore">0</span>
    </div>
    
    <div class="score">COMPUTER SCORE :
        <span id="computerscore">0</span>
    </div>

    <script src="rps.js"></script>
</body>
</html>
