<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <dev id="calculator">
        <input id="display" readonly>
        <dev id="keys">
            <button onclick="appendfun('+')" class="operation">+</button>
            <button onclick="appendfun('7')">7</button>
            <button onclick="appendfun('8')">8</button>
            <button onclick="appendfun('9')">9</button>
            <button onclick="appendfun('-')" class="operation">-</button>
            <button onclick="appendfun('4')">4</button>
            <button onclick="appendfun('5')">5</button>
            <button onclick="appendfun('6')">6</button>
            <button onclick="appendfun('*')" class="operation">*</button>
            <button onclick="appendfun('1')">1</button>
            <button onclick="appendfun('2')">2</button>
            <button onclick="appendfun('3')">3</button>
            <button onclick="appendfun('/')" class="operation">/</button>
            <button onclick="appendfun('0')">0</button>
            <button onclick="appendfun('.')">.</button>
            <button onclick="calculate()">=</button>
            <button onclick="clear()" class="operation">C</button>
        </dev>
    </dev>

    <script src="calc.js"></script>
</body>
</html>
